<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاورمرتك | قائمة الطعام</title>
<meta name="theme-color" content="#111111">
<meta name="description" content="قائمة أسعار مطعم شاورمرتك – Shawermartak restaurant menu">
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lalezar&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1. DESIGN TOKENS
   ========================================================= */
:root{
  --red:#E31E24;
  --red-bright:#FF1E27;
  --black:#111111;
  --white:#FFFFFF;
  --gold:#FFC708;

  --bg:#FAF7F3;
  --ink:#1A1A1A;
  --muted:#6B655F;
  --line:rgba(17,17,17,.10);

  --header-h:64px;
  --chips-h:60px;          /* re-measured by JS */
  --radius-lg:24px;
  --radius-md:16px;

  --font-body:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --font-display:'Lalezar','Cairo',system-ui,sans-serif;
}

/* =========================================================
   2. BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.container{width:min(1180px,100% - 32px);margin-inline:auto}

@media (min-width:560px){:root{--header-h:68px}}

/* =========================================================
   3. SPLASH SCREEN
   ========================================================= */
.splash{
  position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:
    radial-gradient(60% 50% at 50% 42%,rgba(227,30,36,.55),transparent 70%),
    radial-gradient(circle at 50% 100%,#2a0a0c,#0c0c0c 70%);
  transition:opacity 1.5s ease,visibility 1.5s;   /* the slow fade-out */
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:26px;padding:24px;text-align:center}
.splash-logo{
  width:min(60vw,260px);aspect-ratio:1;border-radius:50%;background:var(--white);display:grid;place-items:center;
  box-shadow:0 0 0 6px var(--gold),0 0 0 16px rgba(227,30,36,.4),0 30px 90px rgba(227,30,36,.5);
  animation:logoIn 1.1s cubic-bezier(.2,.9,.3,1.15) both,bob 3.2s ease-in-out 1.1s infinite;
}
.splash-logo img{width:80%;height:80%;object-fit:contain}
.splash-tag{font-family:var(--font-display);font-size:clamp(1.25rem,4.4vw,1.9rem);color:var(--white);animation:fade 1s .7s both}
.splash-bar{width:min(52vw,190px);height:5px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden}
.splash-bar i{display:block;height:100%;transform-origin:0 50%;background:linear-gradient(90deg,var(--gold),var(--red-bright));animation:load 2.5s linear forwards}
.embers{position:absolute;inset:0;z-index:1;pointer-events:none}
.embers span{position:absolute;bottom:-24px;border-radius:50%;background:var(--gold);opacity:0;filter:blur(1px);animation:rise linear infinite}
.embers span:nth-child(3n){background:var(--red-bright)}
@keyframes logoIn{from{opacity:0;transform:scale(.35) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:.85}100%{transform:translateY(-108vh) scale(.3);opacity:0}}

/* =========================================================
   4. HEADER (glass) + MINI LOGO
   inset-inline-start = right in RTL, left in LTR → the mini
   logo automatically sits in the correct corner.
   ========================================================= */
.header{
  position:fixed;top:0;inset-inline:0;z-index:500;height:var(--header-h);
  padding-inline:clamp(10px,3vw,28px);display:flex;align-items:center;gap:10px;color:var(--white);
  background:rgba(17,17,17,.68);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid rgba(255,255,255,.09);
  transform:translateY(-105%);transition:transform .7s cubic-bezier(.2,.8,.2,1);
}
body.ready .header{transform:none}

.mini-logo{
  flex:none;width:46px;height:46px;border-radius:50%;background:var(--white);display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--gold),0 6px 16px rgba(0,0,0,.4);transition:transform .25s;
}
.mini-logo img{width:84%;height:84%;object-fit:contain}
.mini-logo:hover{transform:scale(1.08) rotate(-5deg)}
body.ready .mini-logo{animation:pop .8s .35s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}

.brand{display:none;font-family:var(--font-display);font-size:1.5rem;line-height:1;white-space:nowrap}
@media (min-width:900px){.brand{display:block}}

.search{position:relative;flex:1;min-width:0;max-width:560px;margin-inline:auto}
.search input{
  width:100%;height:42px;border-radius:99px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.12);color:var(--white);font:inherit;font-size:.95rem;
  padding-inline:42px 40px;outline:none;transition:background .2s,border-color .2s,box-shadow .2s;
}
.search input::placeholder{color:rgba(255,255,255,.62)}
.search input:focus{background:rgba(255,255,255,.2);border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,199,8,.25)}
.search input::-webkit-search-cancel-button{display:none}
.search .ico{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.8;pointer-events:none}
.search .clear{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:none;place-items:center;font-size:.8rem;line-height:1}
.search.has-value .clear{display:grid}

.icon-btn{
  flex:none;height:42px;min-width:42px;padding-inline:12px;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:7px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-weight:700;font-size:.85rem;transition:background .2s;
}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{background:rgba(255,255,255,.22)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .lbl{display:none}
@media (min-width:720px){.icon-btn .lbl{display:inline}}

/* currency dropdown */
.pop{position:relative;flex:none}
.pop-menu{
  position:absolute;top:calc(100% + 10px);inset-inline-end:0;min-width:210px;padding:8px;border-radius:var(--radius-md);
  background:var(--white);color:var(--ink);box-shadow:0 24px 60px -12px rgba(0,0,0,.45);
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top;transition:.22s;
}
.pop.open .pop-menu{opacity:1;visibility:visible;transform:none}
.pop-title{padding:6px 12px 8px;font-size:.78rem;color:var(--muted);font-weight:600}
.pop-menu button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;font-weight:700;font-size:.92rem;text-align:start}
.pop-menu button:hover{background:rgba(17,17,17,.05)}
.pop-menu button[aria-checked="true"]{background:rgba(227,30,36,.09);color:var(--red)}
.pop-menu button[aria-checked="true"]::after{content:"✓";font-weight:800}

/* language toggle */
.lang{flex:none;display:flex;padding:3px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.lang button{height:34px;padding-inline:13px;border-radius:99px;font-weight:700;font-size:.85rem;color:rgba(255,255,255,.78);transition:background .25s,color .25s}
.lang button.active{background:var(--red);color:var(--white);box-shadow:0 5px 14px -5px var(--red-bright)}
.lang .short{display:none}
@media (max-width:559px){
  .lang .full{display:none}.lang .short{display:inline}
  .lang button{padding-inline:10px;min-width:36px}
}

/* =========================================================
   5. HERO
   ========================================================= */
.hero{
  position:relative;overflow:hidden;color:var(--white);
  padding:calc(var(--header-h) + 34px) 0 64px;border-radius:0 0 42px 42px;
  background:
    radial-gradient(55% 80% at 88% 15%,rgba(227,30,36,.6),transparent 62%),
    radial-gradient(45% 60% at 8% 95%,rgba(255,199,8,.18),transparent 62%),
    var(--black);
}
.hero::before{ /* fine dot texture */
  content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.5px);background-size:22px 22px;
}
.hero-grid{position:relative;display:grid;gap:30px;align-items:center}
@media (min-width:860px){.hero-grid{grid-template-columns:1.1fr .9fr;gap:48px}}

.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(3.4rem,11vw,6.6rem);line-height:1;letter-spacing:.01em}
.hero .lead{margin-top:14px;font-size:clamp(1.15rem,3.2vw,1.6rem);font-weight:800;color:var(--gold);line-height:1.35;max-width:24ch}
.hero .sub{margin-top:10px;color:rgba(255,255,255,.74);font-size:1.02rem;max-width:44ch}
.hero-cta{margin-top:26px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding-inline:28px;border-radius:99px;font-weight:800;font-size:1rem}
.btn.primary{background:linear-gradient(135deg,var(--red-bright),var(--red));box-shadow:0 14px 30px -10px rgba(255,30,39,.85);transition:transform .2s,box-shadow .2s}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 18px 34px -10px rgba(255,30,39,.95)}
.stat{padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);font-weight:700;font-size:.9rem;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.stat b{color:var(--gold);font-size:1.05rem;margin-inline-end:4px}

.hero-art{position:relative;width:min(74vw,380px);aspect-ratio:1;margin-inline:auto}
.hero-art .photo{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#2a2a2a;box-shadow:0 0 0 6px var(--gold),0 40px 80px -20px rgba(0,0,0,.7)}
.hero-art img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.hero-art img.loaded{opacity:1}
.hero-art .ring{position:absolute;inset:-20px;border-radius:50%;border:2px dashed rgba(255,199,8,.7);animation:spin 40s linear infinite}
.hero-art .sticker{
  position:absolute;inset-inline-start:-4%;bottom:6%;padding:10px 18px;border-radius:99px;background:var(--red);
  font-family:var(--font-display);font-size:1.15rem;box-shadow:0 12px 26px -8px rgba(0,0,0,.6);transform:rotate(-6deg);
}
@keyframes spin{to{transform:rotate(360deg)}}

/* single orchestrated reveal, starts as the splash fades */
.hero-text>*,.hero-art{opacity:0}
body.revealed .hero-text>*{animation:rise-in .9s cubic-bezier(.2,.8,.2,1) both}
body.revealed .hero-text>:nth-child(2){animation-delay:.12s}
body.revealed .hero-text>:nth-child(3){animation-delay:.24s}
body.revealed .hero-text>:nth-child(4){animation-delay:.36s}
body.revealed .hero-art{animation:art-in 1.1s .2s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes rise-in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes art-in{from{opacity:0;transform:scale(.85) rotate(-8deg)}to{opacity:1;transform:none}}

/* =========================================================
   6. CATEGORY CHIPS (sticky, horizontally scrollable)
   ========================================================= */
.chips-bar{
  position:sticky;top:var(--header-h);z-index:400;margin-top:-1px;
  background:rgba(250,247,243,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.chips{display:flex;gap:10px;overflow-x:auto;padding:10px clamp(14px,3vw,28px);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip:first-child{margin-inline-start:auto}.chip:last-child{margin-inline-end:auto}   /* centres when they fit, scrolls when they don't */
.chip{
  flex:none;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;background:var(--white);
  border:1px solid var(--line);font-weight:700;font-size:.92rem;white-space:nowrap;transition:background .2s,color .2s,border-color .2s;
}
.chip:hover{border-color:var(--red)}
.chip.active{background:var(--red);border-color:var(--red);color:var(--white);box-shadow:0 8px 18px -8px rgba(227,30,36,.75)}

/* =========================================================
   7. MENU SECTIONS + ITEM CARDS
   ========================================================= */
#menu{scroll-margin-top:calc(var(--header-h) + var(--chips-h));padding-bottom:40px}
.results-info{margin-top:22px;font-weight:700;color:var(--muted)}
.cat{padding-top:38px;scroll-margin-top:calc(var(--header-h) + var(--chips-h))}
.cat-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.cat-ico{flex:none;width:54px;height:54px;border-radius:18px;background:var(--black);display:grid;place-items:center;font-size:1.65rem;box-shadow:0 0 0 3px var(--gold)}
.cat-head h2{font-family:var(--font-display);font-weight:400;font-size:clamp(1.6rem,4.4vw,2.3rem);line-height:1.1}
.cat-head h2::after{content:"";display:block;width:48px;height:4px;border-radius:9px;background:var(--red);margin-top:7px}
.cat-count{font-size:.85rem;color:var(--muted);font-weight:600}

.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{
  display:flex;flex-direction:column;overflow:hidden;background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:0 10px 28px -16px rgba(17,17,17,.28);
}
.card-media{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(110deg,#ece7e1 30%,#f7f4f0 50%,#ece7e1 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.card-media.done{animation:none}
.card-media img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s,transform .7s}
.card-media img.loaded{opacity:1}
.card:hover .card-media img{transform:scale(1.05)}
@keyframes shimmer{to{background-position:-200% 0}}
.badge{position:absolute;top:10px;inset-inline-start:10px;z-index:2;padding:4px 11px;border-radius:99px;background:var(--gold);color:var(--black);font-weight:800;font-size:.74rem;box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}
.card-body{flex:1;display:flex;flex-direction:column;gap:9px;padding:15px 16px 16px}
.card h3{font-size:1.06rem;font-weight:800;line-height:1.35}
.desc{font-size:.86rem;color:var(--muted);line-height:1.5}

.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:6px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--white);font-weight:700;font-size:.82rem;transition:background .2s,color .2s,border-color .2s}
.opt:hover{border-color:var(--black)}
.opt[aria-checked="true"]{background:var(--black);border-color:var(--black);color:var(--gold)}

.price{margin-top:auto;padding-top:6px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.p-main{display:inline-flex;align-items:baseline;gap:6px}
.p-main b{font-family:var(--font-display);font-weight:400;font-size:1.85rem;line-height:1;color:var(--red)}
.p-main small{font-size:.74rem;font-weight:700;color:var(--muted)}
.p-old{padding:2px 10px;border-radius:99px;background:rgba(255,199,8,.24);color:#6d5200;font-size:.76rem;font-weight:700}
.price.swap{animation:swap .35s}
@keyframes swap{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}

.empty{margin:60px auto;text-align:center;max-width:360px}
.empty .big{font-size:3rem}
.empty h3{font-family:var(--font-display);font-weight:400;font-size:1.8rem;margin-top:6px}
.empty p{color:var(--muted);margin:6px 0 18px}
.empty .btn{background:var(--black);color:var(--white);height:46px}

/* Mobile: horizontal compact cards */
@media (max-width:559px){
  .grid{grid-template-columns:1fr;gap:12px}
  .card{flex-direction:row;border-radius:20px}
  .card-media{width:112px;flex:none;aspect-ratio:auto;min-height:120px}
  .card-body{padding:12px 14px;gap:6px}
  .card h3{font-size:1rem}
  .badge{top:6px;inset-inline-start:6px;padding:2px 8px;font-size:.66rem}
  .p-main b{font-size:1.6rem}
}

/* =========================================================
   8. FOOTER + BACK-TO-TOP
   ========================================================= */
.footer{margin-top:30px;padding:48px 16px calc(40px + env(safe-area-inset-bottom,0px));background:var(--black);color:var(--white);text-align:center;border-radius:42px 42px 0 0}
.footer-logo{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:0 0 0 4px var(--gold)}
.footer-logo img{width:84%;height:84%;object-fit:contain}
.footer .tag{font-family:var(--font-display);font-size:1.5rem}
.footer .note{margin-top:6px;color:rgba(255,255,255,.65);font-size:.9rem}
.footer small{display:block;margin-top:18px;color:rgba(255,255,255,.4)}
.to-top{
  position:fixed;z-index:450;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;
  background:var(--red);color:var(--white);display:grid;place-items:center;box-shadow:0 12px 26px -8px rgba(227,30,36,.8);
  opacity:0;visibility:hidden;transform:translateY(12px);transition:.3s;
}
.to-top.show{opacity:1;visibility:visible;transform:none}
.to-top svg{width:22px;height:22px}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* =========================================================
   9. CART BAR / ORDER SHEET / CONTACT STRIP (added)
   ========================================================= */
.cart-btn{position:relative}
.cart-btn .lbl{display:inline-flex !important}
#cartCnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--gold);color:var(--black);font-size:.68rem;font-weight:800}


.stepper{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 6px;border-radius:99px;background:var(--black);color:var(--white)}
.stepper .stp{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.15);font-size:1.1rem;font-weight:800;display:grid;place-items:center;line-height:1}
.stepper .stp:hover{background:var(--red)}
.stepper b{min-width:16px;text-align:center;font-weight:800}
.add{height:38px;padding:0 16px;border-radius:99px;background:var(--red);color:var(--white);font-weight:800;font-size:.86rem;box-shadow:0 8px 18px -8px rgba(227,30,36,.7);transition:transform .15s}
.add:hover{transform:translateY(-1px)}
.foot{margin-top:auto;padding-top:6px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px}

.cart-bar{position:fixed;z-index:520;bottom:0;inset-inline:0;padding:10px clamp(12px,3vw,24px) calc(10px + env(safe-area-inset-bottom,0px));background:var(--black);border-top:1px solid rgba(255,255,255,.1);box-shadow:0 -14px 30px -14px rgba(0,0,0,.5);transform:translateY(110%);transition:transform .35s}
body.has-cart .cart-bar{transform:none}
.cart-inner{display:flex;align-items:center;gap:12px}
.cart-summary{flex:1;display:flex;align-items:center;gap:10px;color:var(--white);text-align:start}
.cb-count{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--black);font-weight:800;display:grid;place-items:center}
.cb-total{font-weight:800;font-size:1.05rem}
.cb-total small{font-size:.7rem;color:rgba(255,255,255,.6);font-weight:600;margin-inline-start:4px}
.cart-send{height:46px;padding-inline:30px;white-space:nowrap}


/* ---- contact: icons only ---- */
.contact-strip{background:var(--white);border-bottom:1px solid var(--line)}
.ci-row{display:flex;justify-content:center;gap:12px;padding:10px 0}
.ci-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--red);transition:background .2s,color .2s,border-color .2s,transform .15s}
.ci-btn:hover{border-color:var(--red);transform:translateY(-1px)}
.ci-btn[aria-expanded="true"]{background:var(--red);border-color:var(--red);color:var(--white)}
.ci-btn svg{width:20px;height:20px}

/* ---- bar / to-top / footer spacing while an order is in progress ---- */

/* ---- modal sheet (order + review) ---- */

.sheet-lines{display:flex;flex-direction:column}
.sheet-empty{padding:26px 0;text-align:center;color:var(--muted);font-weight:700}
.line{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.l-name b{display:block;font-size:.96rem;font-weight:800}

/* details form */

.phone-row{display:flex;gap:8px;direction:ltr}

.dial-list{position:absolute;bottom:calc(100% + 6px);left:0;z-index:5;min-width:240px;max-height:230px;overflow:auto;padding:6px;border-radius:14px;background:var(--white);border:1px solid var(--line);box-shadow:0 20px 50px -14px rgba(0,0,0,.4)}

.dial-list button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:start}

}

window.imgFallback = el => {
  const tries = (+el.dataset.try || 0) + 1;
  el.dataset.try = tries;
  const pool = POOLS[el.dataset.pool];
  if (pool && tries < pool.length) { el.src = imgUrl(el.dataset.pool, +el.dataset.idx, tries); }
  else { el.onerror = null; el.src = placeholderSVG(el.dataset.emoji || '🍽️'); }
};

/* Syria flag (green / white / black, three red stars) — drawn inline so it works on every device */
const starPts = (cx, cy, R) => Array.from({ length: 10 }, (_, i) => {
  const a = Math.PI / 5 * i - Math.PI / 2, r = i % 2 ? R * .4 : R;
  return `${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`;
}).join(' ');
const SY_FLAG = `<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="6.67" fill="#007A3D"/><rect y="6.67" width="30" height="6.66" fill="#fff"/><rect y="13.33" width="30" height="6.67" fill="#000"/>${[8, 15, 22].map(x => `<polygon points="${starPts(x, 10, 2.4)}" fill="#CE1126"/>`).join('')}</svg>`;
const flagHTML = d => d.iso === 'SY' ? `<span class="flag">${SY_FLAG}</span>` : `<span class="flag iso">${d.iso}</span>`;

/* =========================================================
   6. RENDERING — menu
   ========================================================= */
const priceHTML = price => `<div class="price"><span class="p-main"><b>${fmt(price)}</b><small>${t('unit_new')}</small></span></div>`;

function ctlInner(it) {
  const qty = cart[it.id + '|' + selOf(it)] || 0;
  return qty
    ? `<div class="stepper"><button type="button" class="stp" data-act="dec" aria-label="${t('dec')}">−</button><b>${qty}</b><button type="button" class="stp" data-act="inc" aria-label="${t('inc')}">+</button></div>`
    : `<button type="button" class="add" data-act="add">+ ${t('add')}</button>`;
}

function cardHTML(it) {
  const i = li(), sel = selOf(it);
  const opts = it.o
    ? `<div class="opts" role="radiogroup" aria-label="${it.n[i]}">${it.o.map((o, k) =>
        `<button type="button" class="opt" role="radio" aria-checked="${k === sel}" data-k="${k}">${o[i]}</button>`).join('')}</div>`
    : '';
  const src = it.img || imgUrl(it.pool, it.idx);
  return `<article class="card" data-id="${it.id}">
    <div class="card-media">
      <img alt="${it.n[i]}" loading="lazy" decoding="async" src="${src}" data-pool="${it.pool}" data-idx="${it.idx}" data-emoji="${it.sec.icon}" onload="imgLoaded(this)" onerror="imgFallback(this)">
      ${it.sig ? `<span class="badge">★ ${t('sig')}</span>` : ''}
    </div>
    <div class="card-body">
      <h3>${it.n[i]}</h3>
      <p class="desc">${it.d[i]}</p>
      ${opts}
      <div class="foot">${priceHTML(priceOf(it, sel))}<div class="ctl">${ctlInner(it)}</div></div>
    </div>
  </article>`;
}

const sectionHTML = (id, icon, title, items) => `
  <section class="cat" id="cat-${id}" data-cat="${id}">
    <div class="cat-head">
      <span class="cat-ico" aria-hidden="true">${icon}</span>
      <div><h2>${title}</h2><span class="cat-count"></span></div>
    </div>
    <div class="grid">${items.map(cardHTML).join('')}</div>
  </section>`;

function renderMenu() {
  const i = li(), out = [];
  if (topItems.length) out.push(sectionHTML('top', '⭐', t('top_title'), topItems));
  MENU.forEach(sec => out.push(sectionHTML(sec.id, sec.icon, sec.n[i], sec.items)));
  $('#menuRoot').innerHTML = out.join('');
  const tc = $('#cat-top .cat-count'); if (tc) tc.textContent = `${topItems.length} ${t('stat_items')}`;
  $$('#menuRoot img').forEach(im => { if (im.complete && im.naturalWidth) window.imgLoaded(im); });
}

function renderChips() {
  const i = li(), chips = [];
  if (topItems.length) chips.push(['top', '⭐', t('top_title')]);
  MENU.forEach(sec => chips.push([sec.id, sec.icon, sec.n[i]]));
  $('#chips').innerHTML = chips.map(([id, ic, name]) =>
    `<button type="button" class="chip" data-target="cat-${id}"><span aria-hidden="true">${ic}</span>${name}</button>`).join('');
  syncChipsHeight();
}

/* keep every copy of an item's card (its section + "Most ordered") in sync */
function syncCard(card) {
  const it = itemsById[card.dataset.id], sel = selOf(it);
  $$('.opt', card).forEach((o, k) => o.setAttribute('aria-checked', k === sel));
  $('.price', card).outerHTML = priceHTML(priceOf(it, sel));
  $('.ctl', card).innerHTML = ctlInner(it);
}
const syncItem = it => $$(`.card[data-id="${it.id}"]`).forEach(syncCard);

/* =========================================================
   7. CONTACT — icons only; tap one to reveal its details
   ========================================================= */
let ciOpen = null;
function renderContact() {
  const items = [['ig', ICON.ig, t('ci_ig')], ['tel', ICON.tel, t('ci_tel')], ['addr', ICON.pin, t('ci_addr')]];
  $('#ciRow').innerHTML = items.map(([k, ic, label]) =>
    `<button type="button" class="ci-btn" data-k="${k}" aria-expanded="${ciOpen === k}" aria-controls="ciPanel" aria-label="${label}" title="${label}">${ic}</button>`).join('');

}
function renderPanel() {
  const p = $('#ciPanel');
  if (!ciOpen) { p.hidden = true; p.innerHTML = ''; return; }
  const addr = CONTACT.address[state.lang];
  p.innerHTML = {
    ig:   `<span class="ci-info"><small>${t('ci_ig')}</small><b dir="ltr">${CONTACT.instagramHandle}</b></span><a class="ci-go" href="${CONTACT.instagram}" target="_blank" rel="noopener">${t('open_ig')}</a>`,
    tel:  `<span class="ci-info"><small>${t('ci_tel')}</small><b dir="ltr">${CONTACT.phoneDisplay}</b></span><a class="ci-go" href="tel:+${CONTACT.whatsapp}">${t('call')}</a>`,
    addr: `<span class="ci-info"><small>${t('ci_addr')}</small><b>${addr}</b></span>`
  }[ciOpen];
  p.hidden = false;
}
function toggleContact(k) {
  ciOpen = ciOpen === k ? null : k;
  $$('.ci-btn').forEach(b => b.setAttribute('aria-expanded', b.dataset.k === ciOpen));
  renderPanel();
}

/* =========================================================
   8. ORDER FLOW: list → details form → WhatsApp
   ========================================================= */
let step = 'list', orderType = 'delivery', dial = DIALS[0];
const sheetOpen = () => !$('#sheetWrap').hidden;
const revOpen   = () => !$('#revWrap').hidden;
function syncLock() { document.body.classList.toggle('locked', sheetOpen() || revOpen() || !!$('#splash')); }

function cartLines() {
  return Object.entries(cart).map(([key, qty]) => {
    const [id, k] = key.split('|'), it = itemsById[id];
    return { key, it, k: +k, qty, price: priceOf(it, +k) };
  });
}
function changeQty(key, d) {
  const q = (cart[key] || 0) + d;
  if (q <= 0) delete cart[key]; else cart[key] = Math.min(q, 99);
  syncCart();
}
function syncCart() {
  const lines = cartLines(), i = li(), has = lines.length > 0;
  const count = lines.reduce((n, l) => n + l.qty, 0), total = lines.reduce((n, l) => n + l.qty * l.price, 0);
  $('#cartBar').hidden = !has;
  document.body.classList.toggle('has-cart', has);
  $('#cartCnt').textContent = count;
  $('#cartCntBig').textContent = count;
  const money = `${fmt(total)} <small>${t('unit_new')}</small>`;
  $('#cartTotal').innerHTML = money;
  $('#sheetTotal').innerHTML = money;
  $('#cartLines').innerHTML = has ? lines.map(l => `
    <div class="line" data-key="${l.key}">
      <div class="l-name"><b>${l.it.n[i]}</b>${l.it.o ? `<small>${l.it.o[l.k][i]}</small>` : ''}</div>
      <div class="l-price">${fmt(l.price * l.qty)}</div>
      <div class="stepper"><button type="button" class="stp" data-act="dec" aria-label="${t('dec')}">−</button><b>${l.qty}</b><button type="button" class="stp" data-act="inc" aria-label="${t('inc')}">+</button></div>
    </div>`).join('') : `<p class="sheet-empty">${t('cart_empty')}</p>`;
  $('#stepList .sheet-total-row').hidden = !has;
  $('#btnComplete').disabled = !has;
  $$('.card').forEach(card => { $('.ctl', card).innerHTML = ctlInner(itemsById[card.dataset.id]); });
}

function showStep(s) {
  step = s;
  $('#stepList').hidden = s !== 'list';
  $('#stepForm').hidden = s !== 'form';
  $('#actionsList').hidden = s !== 'list';
  $('#actionsForm').hidden = s !== 'form';
  $('#sheetTitleText').textContent = t(s === 'list' ? 'cart_title' : 'details_title');
  $('#sheetBody').scrollTop = 0;
}
function openSheet() { showStep('list'); $('#sheetWrap').hidden = false; syncLock(); $('#sheetClose').focus(); }
function closeSheet() { $('#sheetWrap').hidden = true; closeDial(); syncLock(); }
function cancelOrder() { Object.keys(cart).forEach(k => delete cart[k]); syncCart(); closeSheet(); }

function setType(tp) {
  orderType = tp;
  $$('.type').forEach(b => b.setAttribute('aria-checked', b.dataset.type === tp));
  $('#addrBox').hidden = tp !== 'delivery';
}

/* country-code dropdown */
function renderDial() {
  $('#dialBtn').innerHTML = `${flagHTML(dial)}<span>+${dial.code}</span>${ICON.caret}`;
  $('#dialList').innerHTML = DIALS.map(d =>
    `<button type="button" role="option" data-iso="${d.iso}" aria-selected="${d.iso === dial.iso}">${flagHTML(d)}<span class="nm">${d[state.lang]}</span><span class="cd">+${d.code}</span></button>`).join('');
}
function closeDial() { $('#dialList').hidden = true; $('#dialBtn').setAttribute('aria-expanded', 'false'); }
function toggleDial() { const open = $('#dialList').hidden; $('#dialList').hidden = !open; $('#dialBtn').setAttribute('aria-expanded', open); }

/* the WhatsApp message (always Arabic — that's what the kitchen reads) */
function buildMessage() {
  const lines = cartLines(), total = lines.reduce((n, l) => n + l.qty * l.price, 0);
  const name = $('#fName').value.trim(), addr = $('#fAddr').value.trim(), notes = $('#fNotes').value.trim();
  const digits = asciiDigits($('#fPhone').value).replace(/\D/g, '').replace(/^0+/, '');
  const typeAr = { delivery: 'توصيل 🛵', dine: 'تناول في المطعم 🍽️', pickup: 'استلام 🥡' }[orderType];
  const bar = '━━━━━━━━━━━━━━';
  const out = ['🍽️ *طلب جديد — شاور مرتك*', bar, `📌 *نوع الطلب:* ${typeAr}`];
  if (name) out.push(`👤 *الاسم:* ${name}`);
  if (digits) out.push(`📞 *الهاتف:* +${dial.code} ${digits}`);
  if (orderType === 'delivery' && addr) out.push(`📍 *العنوان:* ${addr}`);
  out.push('', '🧾 *الطلب:*');
  lines.forEach((l, n) => out.push(`${n + 1}) ${l.it.n[0]}${l.it.o ? ' — ' + l.it.o[l.k][0] : ''} × ${l.qty} = ${fmt(l.price * l.qty)}`));
  out.push(bar, `💰 *المجموع:* ${fmt(total)} ل.س`);
  if (notes) out.push('', `📝 *تعليمات خاصة:* ${notes}`);
  return out.join('\n');
}
function sendWhatsApp() {
  if (!cartLines().length) return;
  if (orderType === 'delivery' && !$('#fAddr').value.trim()) {       // delivery needs an address
    $('#fAddr').classList.add('bad'); $('#addrErr').hidden = false; $('#fAddr').focus(); return;
  }
  window.open(`https://wa.me/${CONTACT.whatsapp}?text=${encodeURIComponent(buildMessage())}`, '_blank', 'noopener');
}

/* =========================================================
   9. REVIEWS — add a review + auto-rotating strip
   ========================================================= */
const validReview = r => r && typeof r.rating === 'number' && r.rating >= 1 && r.rating <= 5 && typeof r.text === 'string' && typeof r.name === 'string';
function loadReviews() { try { const a = JSON.parse(store.get('sm_reviews', '[]')); return Array.isArray(a) ? a.filter(validReview) : []; } catch (e) { return []; } }
const userReviews = loadReviews();
const shownReviews = () => [...REVIEWS_SEED.filter(validReview), ...userReviews].filter(r => r.rating > SHOW_ABOVE_STARS && r.text.trim());

const starsHTML = n => `<span class="stars" role="img" aria-label="${n} / 5">${[1, 2, 3, 4, 5].map(k => `<span class="${k <= n ? '' : 'off'}">${ICON.star}</span>`).join('')}</span>`;

let revIdx = 0, revTimer = null, revRating = 0;
function renderReviews() {
  const list = shownReviews(), stage = $('#revStage'), dots = $('#revDots');
  if (!list.length) { stage.innerHTML = `<p class="rev-empty">${t('no_reviews')}</p>`; dots.innerHTML = ''; return; }
  revIdx = ((revIdx % list.length) + list.length) % list.length;
  const r = list[revIdx];
  stage.innerHTML = `<figure class="rev-card"><span class="rev-q" aria-hidden="true">“</span>${starsHTML(r.rating)}<blockquote class="rev-text">${esc(r.text)}</blockquote><figcaption class="rev-by">— ${esc(r.name || t('rv_anon'))}</figcaption></figure>`;
  dots.innerHTML = list.length > 1 ? list.map((_, k) => `<button type="button" class="dot" data-k="${k}" aria-label="${k + 1} / ${list.length}" aria-current="${k === revIdx}"></button>`).join('') : '';
}
function stopRotate() { clearInterval(revTimer); revTimer = null; }
function startRotate() {
  stopRotate();
  if (shownReviews().length > 1) revTimer = setInterval(() => { revIdx++; renderReviews(); }, ROTATE_MS);
}

function renderPick() {
  $('#revPick').innerHTML = [1, 2, 3, 4, 5].map(v =>
    `<button type="button" class="star ${v <= revRating ? 'on' : ''}" role="radio" aria-checked="${v === revRating}" data-v="${v}" aria-label="${v} ${t('rv_stars')}">${ICON.star}</button>`).join('');
}
function openReview() {
  revRating = 0; renderPick();
  $('#rvName').value = ''; $('#rvText').value = '';
  $('#revErr').hidden = true; $('#revForm').hidden = false; $('#revThanks').hidden = true; $('#revSend').hidden = false;
  $('#revWrap').hidden = false; syncLock();
  const first = $('#revPick .star'); if (first) first.focus();
}
function closeReview() { $('#revWrap').hidden = true; syncLock(); }
function submitReview() {
  if (!revRating) { $('#revErr').hidden = false; return; }
  const r = { name: $('#rvName').value.trim().slice(0, MAX_NAME), rating: revRating, text: $('#rvText').value.trim().slice(0, MAX_COMMENT), ts: Date.now() };
  userReviews.push(r);
  store.set('sm_reviews', JSON.stringify(userReviews.slice(-50)));
  const visible = r.rating > SHOW_ABOVE_STARS && r.text;
  $('#revThanksMsg').textContent = t(visible ? 'rv_thanks_hi' : 'rv_thanks_lo');
  $('#revForm').hidden = true; $('#revThanks').hidden = false; $('#revSend').hidden = true;
  if (visible) revIdx = shownReviews().length - 1;
  renderReviews(); startRotate();
}

/* =========================================================
   10. SEARCH / FILTER
   ========================================================= */
function applyFilter() {
  const tokens = norm(state.q).split(' ').filter(Boolean), searching = tokens.length > 0;
  let total = 0;
  MENU.forEach(sec => {
    let shown = 0;
    sec.items.forEach(it => {
      const ok = tokens.every(tk => it._s.includes(tk));
      $$(`.card[data-id="${it.id}"]`).forEach(c => { c.hidden = !ok; });
      if (ok) shown++;
    });
    total += shown;
    const secEl = $('#cat-' + sec.id);
    secEl.hidden = shown === 0;
    $('.cat-count', secEl).textContent = `${shown} ${t('stat_items')}`;
    $(`.chip[data-target="cat-${sec.id}"]`).hidden = shown === 0;
  });
  const topEl = $('#cat-top'); if (topEl) { topEl.hidden = searching; $('.chip[data-target="cat-top"]').hidden = searching; }
  const info = $('#resultsInfo');
  info.hidden = !searching || total === 0;
  info.textContent = total === 1 ? t('results_one') : t('results_many')(total);
  $('#empty').hidden = !(searching && total === 0);
  $('#search').classList.toggle('has-value', !!state.q);
  $('#searchClear').hidden = !state.q;
  syncChipsHeight();
  spy();
}

/* =========================================================
   11. LANGUAGE (Arabic RTL ⇄ English LTR)
   ========================================================= */
function applyLang() {
  const root = document.documentElement;
  root.lang = state.lang;
  root.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('title');
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $$('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  $$('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
  $('#statSections').textContent = MENU.length;
  $('#statItems').textContent = MENU.reduce((n, s) => n + s.items.length, 0);
  renderChips();
  renderMenu();
  renderContact();
  renderDial();
  renderPick();
  renderReviews();
  showStep(step);
  syncCart();
  applyFilter();
}

/* =========================================================
   12. SCROLL BEHAVIOUR
   ========================================================= */
function syncChipsHeight() {
  const h = $('#chipsBar').offsetHeight;
  if (h) document.documentElement.style.setProperty('--chips-h', h + 'px');
}
let spyQueued = false, lastChip = null;
function spy() {
  if (spyQueued) return;
  spyQueued = true;
  requestAnimationFrame(() => {
    spyQueued = false;
    const headH = $('#header').offsetHeight + $('#chipsBar').offsetHeight;
    let current = null;
    $$('.cat').forEach(sec => { if (!sec.hidden && sec.getBoundingClientRect().top - headH - 40 <= 0) current = sec.id; });
    let activeChip = null;
    $$('.chip').forEach(c => { const on = c.dataset.target === current; c.classList.toggle('active', on); if (on) activeChip = c; });
    if (activeChip && activeChip !== lastChip) {
      const strip = $('#chips'), sr = strip.getBoundingClientRect(), cr = activeChip.getBoundingClientRect();
      strip.scrollBy({ left: (cr.left + cr.width / 2) - (sr.left + sr.width / 2), behavior: 'smooth' });
    }
    lastChip = activeChip;
    $('#toTop').classList.toggle('show', window.scrollY > 800);
  });
}
function goHome() {
  if (state.q) { state.q = ''; $('#searchInput').value = ''; applyFilter(); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   13. EVENTS
   ========================================================= */
function bind() {
  $('#miniLogo').addEventListener('click', e => { e.preventDefault(); goHome(); });   // mini logo → home
  $('#toTop').addEventListener('click', goHome);

  $$('.lang button').forEach(b => b.addEventListener('click', () => {
    if (state.lang === b.dataset.lang) return;
    state.lang = b.dataset.lang; store.set('sm_lang', state.lang); applyLang();
  }));

  /* search */
  const input = $('#searchInput');
  input.addEventListener('input', () => {
    const wasEmpty = !state.q;
    state.q = input.value; applyFilter();
    if (wasEmpty && state.q && window.scrollY < $('#menu').offsetTop - 120) $('#menu').scrollIntoView({ behavior: 'smooth' });
  });
  const clear = () => { state.q = ''; input.value = ''; applyFilter(); input.focus(); };
  $('#searchClear').addEventListener('click', clear);
  $('#emptyClear').addEventListener('click', clear);

  $('#chips').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    $('#' + c.dataset.target).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* contact icons */
  $('#ciRow').addEventListener('click', e => { const b = e.target.closest('.ci-btn'); if (b) toggleContact(b.dataset.k); });

  /* cards: option pills + add / − / + */
  $('#menuRoot').addEventListener('click', e => {
    const card = e.target.closest('.card'); if (!card) return;
    const it = itemsById[card.dataset.id];
    const opt = e.target.closest('.opt');
    if (opt) {
      state.sel[it.id] = +opt.dataset.k;
      syncItem(it);
      const p = $('.price', card); if (p) p.classList.add('swap');
      return;
    }
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    changeQty(it.id + '|' + selOf(it), btn.dataset.act === 'dec' ? -1 : 1);
  });

  /* order bar + sheet */
  ['#cartOpen', '#cartOpen2', '#cartOrder'].forEach(id => $(id).addEventListener('click', openSheet));
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetBack').addEventListener('click', closeSheet);
  $('#btnCancel').addEventListener('click', cancelOrder);
  $('#btnComplete').addEventListener('click', () => { showStep('form'); });
  $('#btnBack').addEventListener('click', () => showStep('list'));
  $('#btnWA').addEventListener('click', sendWhatsApp);
  $('#stepForm').addEventListener('submit', e => e.preventDefault());
  $('#cartLines').addEventListener('click', e => {
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    changeQty(btn.closest('.line').dataset.key, btn.dataset.act === 'dec' ? -1 : 1);
  });
  $$('.type').forEach(b => b.addEventListener('click', () => setType(b.dataset.type)));
  $('#fAddr').addEventListener('input', () => { $('#fAddr').classList.remove('bad'); $('#addrErr').hidden = true; });
  $('#dialBtn').addEventListener('click', toggleDial);
  $('#dialList').addEventListener('click', e => {
    const b = e.target.closest('[data-iso]'); if (!b) return;
    dial = DIALS.find(d => d.iso === b.dataset.iso) || DIALS[0]; renderDial(); closeDial();
  });
  document.addEventListener('click', e => { if (!e.target.closest('#dial')) closeDial(); });

  /* reviews */
  $('#revAdd').addEventListener('click', openReview);
  $('#revClose').addEventListener('click', closeReview);
  $('#revBack').addEventListener('click', closeReview);
  $('#revCancel').addEventListener('click', closeReview);
  $('#revSend').addEventListener('click', submitReview);
  $('#revForm').addEventListener('submit', e => e.preventDefault());
  $('#revPick').addEventListener('click', e => {
    const b = e.target.closest('.star'); if (!b) return;
    revRating = +b.dataset.v; $('#revErr').hidden = true; renderPick();
    const again = $(`#revPick .star[data-v="${revRating}"]`); if (again) again.focus();
  });
  $('#revDots').addEventListener('click', e => {
    const d = e.target.closest('.dot'); if (!d) return;
    revIdx = +d.dataset.k; renderReviews(); startRotate();
  });
  const rs = $('#revStage');
  rs.addEventListener('mouseenter', stopRotate); rs.addEventListener('mouseleave', startRotate);
  rs.addEventListener('focusin', stopRotate);    rs.addEventListener('focusout', startRotate);

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('#dialList').hidden) closeDial(); else if (revOpen()) closeReview(); else if (sheetOpen()) closeSheet();
  });

  window.addEventListener('scroll', spy, { passive: true });
  window.addEventListener('resize', () => { syncChipsHeight(); spy(); });
}

/* =========================================================
   14. SPLASH SEQUENCE: visible 2.5s → slow fade → header + mini logo pop in
   ========================================================= */
function runSplash() {
  const splash = $('#splash'), embers = $('#embers');
  for (let k = 0; k < 24; k++) {
    const s = document.createElement('span'), size = 4 + Math.random() * 9;
    s.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;animation-duration:${4 + Math.random() * 5}s;animation-delay:${-Math.random() * 6}s`;
    embers.appendChild(s);
  }
  let finished = false;
  const finish = () => {
    if (finished) return; finished = true;
    splash.remove();
    syncLock();
    document.body.classList.add('ready');
  };
  const hide = () => {
    if (splash.classList.contains('hide')) return;
    splash.classList.add('hide');
    document.body.classList.add('revealed');
    setTimeout(finish, SPLASH_FADE_MS);
  };
  setTimeout(hide, SPLASH_VISIBLE_MS);
  splash.addEventListener('click', hide);
}

/* =========================================================
   15. INIT
   ========================================================= */
function init() {
  $$('img[data-logo]').forEach(im => { im.src = LOGO; });
  $('#favicon').href = LOGO;
  $('#year').textContent = new Date().getFullYear();
  $$('img[data-pool]:not([src])').forEach(im => { im.src = imgUrl(im.dataset.pool, +im.dataset.idx || 0); });
  bind();
  setType('delivery');
  applyLang();
  startRotate();
  runSplash();
}
init();
})();
</script>
